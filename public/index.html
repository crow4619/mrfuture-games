<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="MR_FUTURE GAMES — an independent game development studio."
    />
    <meta name="theme-color" content="#160f2b" />
    <meta property="og:title" content="MR_FUTURE GAMES" />
    <meta
      property="og:description"
      content="MR_FUTURE GAMES — an independent game development studio."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mrfuture.games/" />
    <meta
      property="og:image"
      content="https://mrfuture.games/assets/mrfuturegames-logo.png?v=figma-1"
    />
    <title>MR_FUTURE GAMES</title>
    <link rel="icon" href="/favicon.png?v=figma-3" type="image/png" sizes="64x64" />
    <link rel="preload" href="/assets/background.png" as="image" />
    <link rel="preload" href="/assets/mrfuturegames-logo.png?v=figma-1" as="image" />
    <link rel="stylesheet" href="/styles.css?v=cozy-brand-3" />
    <script src="/script.js" defer></script>
  </head>
  <body class="is-intro">
    <main class="studio-portal">
      <h1 class="visually-hidden">MR_FUTURE GAMES</h1>

      <img
        class="studio-logo"
        src="/assets/mrfuturegames-logo.png?v=figma-1"
        width="615"
        height="182"
        alt="MR_FUTURE GAMES"
      />

      <section class="game-section" aria-labelledby="games-heading">
        <h2 id="games-heading">OUR GAME</h2>

        <article class="game-card" aria-labelledby="cozy-cockpit-title">
          <a
            class="game-artwork"
            href="https://store.steampowered.com/app/5251280/Cozy_Cockpit/"
            aria-label="Explore Cozy Cockpit on Steam"
          >
            <img
              class="game-landscape"
              src="/assets/cozy-cockpit/landscape.webp"
              width="1100"
              height="368"
              alt=""
            />
            <img
              class="game-clouds"
              src="/assets/cozy-cockpit/clouds.webp"
              width="1100"
              height="368"
              alt=""
            />
            <div class="game-brand">
              <h3 id="cozy-cockpit-title">
                <img class="game-logo" src="/assets/cozy-cockpit/logo.webp" width="800" height="194" alt="Cozy Cockpit" />
              </h3>
              <p class="game-tagline">COZY FLIGHTS. CURIOUS SIGHTS.</p>
            </div>
            <img
              class="game-aircraft"
              src="/assets/cozy-cockpit/aircraft.webp"
              width="800"
              height="276"
              alt="An orange and white Cozy Airways aircraft soaring above a moonlit landscape"
            />
          </a>

          <div class="game-details">
            <p class="game-description">A cozy observation adventure.<br />The plane flies itself. You enjoy the view.</p>
            <div class="game-actions">
              <a class="game-cta" href="https://store.steampowered.com/app/5251280/Cozy_Cockpit/">
                <img src="/assets/social/steam.svg" width="24" height="24" alt="" aria-hidden="true" />
                Wishlist on Steam
              </a>
              <a class="game-website" href="https://cozycockpit.com/">Visit website <span aria-hidden="true">↗</span></a>
            </div>
          </div>
        </article>
      </section>

      <footer class="portal-footer">
        <nav class="social-links" aria-label="Contact and social media">
          <a
            class="social-link social-link--email"
            href="mailto:hello@mrfuture.games"
            aria-label="Email MR_FUTURE GAMES"
          >
            <img src="/assets/mail.svg" width="36" height="26" alt="" aria-hidden="true" />
          </a>
          <a
            class="social-link social-link--steam"
            href="https://store.steampowered.com/search/?developer=MR%20FUTURE%20GAMES"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="MR FUTURE GAMES on Steam"
          >
            <img src="/assets/social/steam.svg" width="24" height="24" alt="" aria-hidden="true" />
          </a>
          <a
            class="social-link social-link--itchio"
            href="https://mrfuturegames.itch.io/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="MR_FUTURE GAMES on itch.io"
          >
            <img src="/assets/social/itchio.svg" width="24" height="24" alt="" aria-hidden="true" />
          </a>
          <a
            class="social-link social-link--youtube"
            href="https://www.youtube.com/channel/UCboed4JIfjArf-j55Itq0Cg"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="MR_FUTURE GAMES on YouTube"
          >
            <img
              src="/assets/social/video-channel.svg?v=1"
              width="24"
              height="24"
              alt=""
              aria-hidden="true"
            />
          </a>
          <a
            class="social-link social-link--bluesky"
            href="https://bsky.app/profile/mrfuturegames.bsky.social"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="MR_FUTURE GAMES on Bluesky"
          >
            <img src="/assets/social/bluesky.svg" width="24" height="24" alt="" aria-hidden="true" />
          </a>
        </nav>
        <p>© <span data-year>2026</span> MR_FUTURE GAMES. All Rights Reserved.</p>
      </footer>
    </main>
  </body>
</html>
