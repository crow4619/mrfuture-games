<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="MR_FUTURE GAMES — an independent game development studio."
    />
    <meta name="theme-color" content="#160f2b" />
    <meta property="og:title" content="MR_FUTURE GAMES" />
    <meta
      property="og:description"
      content="MR_FUTURE GAMES — an independent game development studio."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mrfuture.games/" />
    <meta
      property="og:image"
      content="https://mrfuture.games/assets/mrfuturegames-logo.png?v=figma-1"
    />
    <title>MR_FUTURE GAMES</title>
    <link rel="icon" href="/favicon.png?v=figma-3" type="image/png" sizes="64x64" />
    <link rel="preload" href="/assets/background.png" as="image" />
    <link rel="preload" href="/assets/mrfuturegames-logo.png?v=figma-1" as="image" />
    <link rel="stylesheet" href="/styles.css?v=social-1" />
    <script src="/script.js" defer></script>
  </head>
  <body class="is-intro">
    <main class="studio-portal">
      <h1 class="visually-hidden">MR_FUTURE GAMES</h1>

      <img
        class="studio-logo"
        src="/assets/mrfuturegames-logo.png?v=figma-1"
        width="615"
        height="182"
        alt="MR_FUTURE GAMES"
      />

      <section class="game-section" aria-labelledby="games-heading">
        <h2 id="games-heading">OUR GAME</h2>

        <a
          class="game-card"
          href="https://www.cozycockpit.com"
          aria-label="Visit the Cozy Cockpit website"
        >
          <div class="game-preview">
            <img
              src="/assets/cozy-cockpit-screenshot.png"
              width="1658"
              height="925"
              alt="A pixel-art aircraft cockpit flying above a coastal landscape in Cozy Cockpit"
            />
          </div>

          <div class="game-details">
            <img
              class="game-logo"
              src="/assets/cozy-cockpit-logo.png"
              width="1742"
              height="560"
              alt="Cozy Cockpit"
            />
            <span class="game-description">
              A cozy observation adventure, where the journey is the destination.
            </span>
            <span class="game-cta">VISIT WEBSITE</span>
          </div>
        </a>
      </section>

      <footer class="portal-footer">
        <nav class="social-links" aria-label="Contact and social media">
          <a
            class="social-link social-link--email"
            href="mailto:hello@mrfuture.games"
            aria-label="Email MR_FUTURE GAMES"
          >
            <img src="/assets/mail.svg" width="36" height="26" alt="" aria-hidden="true" />
          </a>
          <a
            class="social-link social-link--itchio"
            href="https://mrfuturegames.itch.io/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="MR_FUTURE GAMES on itch.io"
          >
            <img src="/assets/social/itchio.svg" width="24" height="24" alt="" aria-hidden="true" />
          </a>
          <a
            class="social-link social-link--youtube"
            href="https://www.youtube.com/channel/UCboed4JIfjArf-j55Itq0Cg"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="MR_FUTURE GAMES on YouTube"
          >
            <img src="/assets/social/youtube.svg" width="24" height="24" alt="" aria-hidden="true" />
          </a>
          <a
            class="social-link social-link--bluesky"
            href="https://bsky.app/profile/mrfuturegames.bsky.social"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="MR_FUTURE GAMES on Bluesky"
          >
            <img src="/assets/social/bluesky.svg" width="24" height="24" alt="" aria-hidden="true" />
          </a>
        </nav>
        <p>© <span data-year>2026</span> MR_FUTURE GAMES. All Rights Reserved.</p>
      </footer>
    </main>
  </body>
</html>
